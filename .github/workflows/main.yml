name: Windows-RDP
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
      - name: Set Password
        run: net user runneradmin GamePassword123!
      - name: Start Ngrok TCP Tunnel
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath . -Force
          .\ngrok.exe authtoken 3LSo2HBeCN3JTML1C8AfW6Iaow5_3Y4VJyVlgD87FLjRG
          Start-Process powershell -ArgumentList '-Noexit -Command ".\ngrok.exe tcp 3389"'
      - name: Keep Alive
        run: sleep 21600
